<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus Vault Sync · Obsidian 高速实时同步服务</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
</head>
<body>

<div id="login-view" class="center-screen center-box">
  <form id="login-form" class="card login-card">
    <div class="brand">
      <span class="logo">☁️</span>
      <span class="brand-name">Nimbus Vault Sync</span>
    </div>
    <div class="subtitle">Obsidian 高速实时同步服务 · 管理后台</div>

    <label>
      <span>服务器地址</span>
      <input type="text" id="login-server" placeholder="留空默认当前服务器 (自动识别端口)" />
    </label>
    <label>
      <span>用户名</span>
      <input type="text" id="login-username" required autocomplete="username" />
    </label>
    <label>
      <span>密码</span>
      <input type="password" id="login-password" required autocomplete="current-password" />
    </label>

    <div id="login-error" class="error-msg"></div>
    <button type="submit" class="primary">登录</button>
  </form>
</div>

<div id="app-view" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo">☁️</span>
      <span class="brand-name">Nimbus Vault Sync</span>
      <span class="brand-badge">Fast Sync</span>
    </div>
    <div class="topbar-center">
      <button id="topbar-search-btn" class="topbar-search-btn" title="全局快速检索 (Ctrl+K)">
        <span>🔍</span>
        <span class="search-placeholder">全局检索笔记与内容...</span>
        <kbd class="shortcut-kbd">Ctrl K</kbd>
      </button>
      <div class="sync-indicator" id="hub-status-indicator" title="实时同步服务运行中">
        <span class="status-dot"></span>
        <span class="status-text" id="hub-status-text">同步服务就绪</span>
      </div>
    </div>
    <div class="who">
      <!-- Theme Switcher Selector -->
      <div class="theme-picker-wrap" id="theme-picker-container">
        <button id="theme-menu-btn" class="theme-menu-btn" title="切换后台主题与配色">
          <span class="theme-color-dot" id="theme-color-dot"></span>
          <span id="theme-label-name">默认科技蓝</span>
          <span style="font-size:10px;opacity:0.7;">▼</span>
        </button>
        <div id="theme-dropdown-menu" class="theme-dropdown-menu hidden">
          <button class="theme-opt-item" data-theme-val="default">
            <span class="dot" style="background:#58a6ff;box-shadow:0 0 6px #58a6ff;"></span>
            <span>经典科技蓝 (默认)</span>
          </button>
          <button class="theme-opt-item" data-theme-val="obsidian">
            <span class="dot" style="background:#9d7cd8;box-shadow:0 0 6px #9d7cd8;"></span>
            <span>Obsidian 紫魅夜</span>
          </button>
          <button class="theme-opt-item" data-theme-val="emerald">
            <span class="dot" style="background:#10b981;box-shadow:0 0 6px #10b981;"></span>
            <span>翡翠极光绿</span>
          </button>
          <button class="theme-opt-item" data-theme-val="azure">
            <span class="dot" style="background:#0284c7;box-shadow:0 0 6px #0284c7;"></span>
            <span>深海蔚蓝</span>
          </button>
          <button class="theme-opt-item" data-theme-val="rose">
            <span class="dot" style="background:#e11d48;box-shadow:0 0 6px #e11d48;"></span>
            <span>琥珀丝绒红</span>
          </button>
          <button class="theme-opt-item" data-theme-val="mono">
            <span class="dot" style="background:#ffffff;box-shadow:0 0 6px #ffffff;"></span>
            <span>OLED 纯黑极简</span>
          </button>
          <button class="theme-opt-item" data-theme-val="light">
            <span class="dot" style="background:#2563eb;"></span>
            <span>明亮白昼 (Light)</span>
          </button>
        </div>
      </div>

      <span id="who-username" class="user-pill"></span>
      <span id="who-role" class="badge"></span>
      <button id="logout-btn" class="ghost">退出</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-body">
        <div class="sidebar-header">
          <div class="nav-section-title">我的 Vaults</div>
          <button id="new-vault-btn" class="btn-icon" title="新建 Vault">+</button>
        </div>
        <ul id="vault-list" class="vault-list"></ul>

        <div class="nav-section-title" style="margin-top:24px">快捷工具</div>
        <ul class="nav-menu">
          <li><button class="nav-item tab-btn" id="global-settings-btn" data-tab="settings">⚙️ 设置</button></li>
          <li><button class="nav-item tab-btn" data-tab="devices">📱 接入设备管理</button></li>
          <li><button class="nav-item" id="global-connect-btn">⚡ Obsidian 连接指引</button></li>
          <li><button class="nav-item" id="global-mcp-btn">🤖 AI / MCP 接口配置</button></li>
          <li><button class="nav-item" id="global-docs-btn">📖 REST API 开发者文档</button></li>
          <li><button class="nav-item tab-btn" id="global-sponsor-btn" data-tab="sponsor">❤️ 支持该项目</button></li>
        </ul>

        <div id="admin-nav" class="hidden">
          <div class="nav-section-title" style="margin-top:24px">系统管理</div>
          <ul class="nav-menu">
            <li><button class="tab-btn" data-tab="settings">⚙️ 设置</button></li>
            <li><button class="tab-btn" data-tab="database">🗄️ 数据库管理</button></li>
            <li><button class="tab-btn" data-tab="webhooks">🔔 Webhook 告警</button></li>
            <li><button class="tab-btn" data-tab="synclogs">📋 同步日志</button></li>
            <li><button class="tab-btn" data-tab="devices">📱 全局设备</button></li>
            <li><button class="tab-btn" data-tab="users">👥 用户管理</button></li>
            <li><button class="tab-btn" data-tab="all-vaults">📚 全局 Vault</button></li>
            <li><button class="tab-btn" data-tab="sponsor">❤️ 赞助支持</button></li>
          </ul>
        </div>
      </div>

      <div class="sidebar-footer">
        <a href="https://github.com/lengedliu/nimbus-vault-sync" target="_blank" rel="noopener noreferrer" class="sidebar-github-link" title="访问 GitHub 开源仓库 (lengedliu/nimbus-vault-sync)">
          <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <div class="sidebar-version-badge" title="当前版本">v1.2.0</div>
      </div>
    </nav>

    <main class="main" id="main-panel">
      <div class="empty-state">
        <div style="font-size:48px;margin-bottom:12px;">📓</div>
        <p>从左侧选择一个 Vault 开始管理，或新建一个 Vault 进行 Obsidian 同步</p>
      </div>
    </main>
  </div>
</div>

<!-- Modal Container for Connect / Share / Diff -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal-container" class="modal-container"></div>
</div>

<script src="app.js"></script>
</body>
</html>
